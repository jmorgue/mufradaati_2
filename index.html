<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060E1A;color:#EDE0C6;font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;overflow-x:hidden;}
input,select,textarea,button{font-family:inherit;}
input::placeholder,textarea::placeholder{color:#445566;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:rgba(196,158,60,.2);border-radius:2px;}
select option{background:#0C1B30;color:#EDE0C6;}
.inp{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(196,158,60,0.18);border-radius:8px;padding:11px 14px;color:#EDE0C6;font-size:15px;outline:none;}
.inp:focus{border-color:rgba(196,158,60,0.45);}
.lbl{display:block;font-size:11px;color:#667788;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;}
.btn1{background:linear-gradient(135deg,#C49E3C,#B85C28);color:#fff;border:none;border-radius:10px;padding:13px 26px;font-size:14px;cursor:pointer;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;}
.btn1:hover{opacity:.9;}
.btn1:disabled{opacity:.5;cursor:not-allowed;}
.btn2{background:transparent;color:#C49E3C;border:1px solid rgba(196,158,60,0.35);border-radius:10px;padding:11px 22px;font-size:13px;cursor:pointer;}
.btn2:hover{border-color:#C49E3C;}
.shell{max-width:680px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1;}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:1px solid rgba(196,158,60,0.18);margin-bottom:22px;}
nav .nb{white-space:nowrap;}
@media (max-width:520px){
  nav{justify-content:center;}
  nav>div:last-child{width:100%;justify-content:center;}
}
.nb{padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;background:transparent;color:#667788;font-family:inherit;}
.nb.act{background:rgba(196,158,60,0.12);color:#C49E3C;}

/* ── Night sky: starfield + girih tessellation, both barely-there ── */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:var(--orn-stars),var(--orn-girih),
    radial-gradient(ellipse at 12% 18%,rgba(196,158,60,.08) 0%,transparent 55%),
    radial-gradient(ellipse at 88% 82%,rgba(184,92,40,.06) 0%,transparent 55%);
  background-repeat:repeat,repeat,no-repeat,no-repeat;
  background-size:240px 240px,130px 130px,auto,auto;
  animation:nightbreathe 14s ease-in-out infinite;}
@keyframes nightbreathe{0%,100%{opacity:.85;}50%{opacity:1;}}
/* Lantern warmth pooling at the base of the screen */
.glow::after{content:'';position:absolute;left:0;right:0;bottom:0;height:38vh;
  background:radial-gradient(ellipse at 50% 120%,rgba(196,158,60,.07) 0%,transparent 62%);}

const LEGACY_LEVEL_MAP={L2Q:"L2B",L2H:"L2A",L5Q:"L5B",L5H:"L5A"};
function mig(id){return LEGACY_LEVEL_MAP[id]||id;}

// ── Session budget with type-weighted sampling ────────────────────
// On a 200-card backlog you can't review everything, so the question becomes
// which cards a short session should spend itself on. Verbs and set phrases
// carry more comprehension per card, so they're sampled more heavily — but a
// share of every session is reserved for badly-overdue cards regardless of
// type, otherwise deprioritized nouns would quietly rot at the bottom of the
// queue and their intervals would blow out without you ever deciding that.
const TYPE_WEIGHT={
  Verb:3.0, Phrase:2.2, Adjective:1.3, Noun:1.0,
  Adverb:1.0, Preposition:0.7, Conjunction:0.7, Other:0.9
};
const SESSION_SIZES=[20,40,60,100];
const STARVE_DAYS=7;    // overdue by more than this and a card gets rescued
const RESCUE_SHARE=0.3; // fraction of each session reserved for the rescue tier

function sessionBudget(){const v=gLS("mufradat-session-budget");return v===null?null:v;}
function setSessionBudget(n){sLS("mufradat-session-budget",n);R();}
function prioritizeTypes(){const v=gLS("mufradat-prioritize-types");return v===null?true:!!v;}
function setPrioritizeTypes(on){sLS("mufradat-prioritize-types",!!on);R();}

// Efraimidis–Spirakis weighted sampling without replacement:
// give each item the key U^(1/weight) and take the largest keys.
function weightedSample(items,n,weightOf){
  if(n>=items.length)return items.slice();
  return items
    .map(it=>({it,key:Math.pow(Math.random(),1/Math.max(weightOf(it),1e-6))}))
    .sort((a,b)=>b.key-a.key)
    .slice(0,n)
    .map(x=>x.it);
}

// Choose which cards from a single step's box snapshot make it into this
// session (a size cap per step, not a global one — see rewritten review
// engine below). "Overdue" no longer has a per-card due-date to measure, so
// staleness is read off queuedAt: how long a word has sat in this box
// untouched.
// Returns {picked, rescued} — rescued is how many came from the overdue tier.
function buildSession(pool,budget,prioritize){
  if(!budget||budget>=pool.length)return{picked:pool.slice(),rescued:0};
  if(!prioritize){
    // No type weighting — straight triage, longest-waiting first
    return{picked:pool.slice().sort((a,b)=>(a.queuedAt||0)-(b.queuedAt||0)).slice(0,budget),rescued:0};
  }
  const now=Date.now();
  const starving=pool.filter(w=>(now-(w.queuedAt||0))/86400000>STARVE_DAYS)
                     .sort((a,b)=>(a.queuedAt||0)-(b.queuedAt||0));
  const rescued=starving.slice(0,Math.min(starving.length,Math.floor(budget*RESCUE_SHARE)));
  const rescuedIds=new Set(rescued.map(w=>w.id));
  const rest=pool.filter(w=>!rescuedIds.has(w.id));
  const fill=weightedSample(rest,budget-rescued.length,w=>TYPE_WEIGHT[w.wordType]||1.0);
  return{picked:rescued.concat(fill),rescued:rescued.length};
}
// Correct/incorrect destinations. L2B's correct route depends on the day —
// everything else is fixed. Wrong answers always land in a waiting box;
// correct answers land either in a waiting box or in a box that has already
// run earlier this session (steps go high-to-low), so nothing is ever
// quizzed twice in one sitting.
function correctDest(level){
  if(level==="L1")return"L2A";
  if(level==="L2B"){const day=new Date().getDay();return(day===2||day===6)?"L3Q":"L3";} // Tue/Sat -> waiting
  if(level==="L3")return"L4";

}

// Vault cards are generated lean — no example sentence, which roughly halves

// on words we're going to see. One API call covers the whole batch.

// Never blocks the promotion: if there's no key, no connection, or the call

async function fillExamples(words){
  const need=(words||[]).filter(w=>w&&w.arabic&&!(w.example||"").trim());

Keep sentences short — under 12 words. Use the dialect given for each entry. For entries showing several forms separated by " · ", use whichever form reads most naturally.

Entries:
${batch.map((w,i)=>`${i+1}. ${w.arabic} — ${w.english} [${w.dialect||"MSA"}]`).join("\n")}

Return ONLY a valid JSON array of ${batch.length} strings, in the same order, no markdown:
["sentence 1 (translation)", "sentence 2 (translation)", ...]`;

// ── VAULT ──────────────────────────────────────────────────────────

// Fill Level 1: top the L1+L1Q pool up to the target, priority-starred first

    take.slice(0,15).map(w=>"  • "+w.arabic+" — "+w.english).join("\n")+

// ── DEDUP ──
// Level order from lowest to highest
const LEVEL_ORDER = ["V","L1Q","L1","L2A","L2B","L3Q","L3","L4Q","L4","L5A","L5B","M"];
function levelRank(id){return LEVEL_ORDER.indexOf(id);}

// Find exact duplicates (same text after diacritic-stripping). Read-only.
function findDuplicateGroups(){
  const seen={};
  uw.forEach(w=>{
    const key=normArabic(w.arabic);
    if(!key)return;
    (seen[key]=seen[key]||[]).push(w);
  });
  return Object.entries(seen)
    .filter(([,g])=>g.length>1)
    .map(([key,g])=>({
      key,
      words:g.slice().sort((a,b)=>{
        const la=mig(prog[a.id]?.leitnerLevel||a.leitnerLevel||"V");
        const lb=mig(prog[b.id]?.leitnerLevel||b.leitnerLevel||"V");
        const r=levelRank(lb)-levelRank(la);
        return r!==0?r:(b.createdAt||0)-(a.createdAt||0);
      })
    }));
}

// ── Safety snapshots ──────────────────────────────────────────────
// A rolling local backup of the whole deck, taken whenever the deck shrinks
// or once a day. Purely local, but it means an accidental mass-delete is
// recoverable instead of final.
function snapKey(){return CU?`mufradat-snapshots-${CU.username}`:"mufradat-snapshots";}

function takeSnapshot(reason){
  if(!CU||!uw.length)return;
  const snaps=getSnapshots();
  const last=snaps[snaps.length-1];
  // Skip if nothing meaningful changed since the last one
  if(last&&last.count===uw.length&&reason==="daily")return;
  snaps.push({at:Date.now(),reason,count:uw.length,
    words:uw.map(w=>({id:w.id,arabic:w.arabic,english:w.english,example:w.example||"",
      wordType:w.wordType,dialect:w.dialect,createdAt:w.createdAt,
      leitnerLevel:prog[w.id]?.leitnerLevel||w.leitnerLevel||"L1"}))});
  while(snaps.length>5)snaps.shift(); // keep the 5 most recent
  try{sLS(snapKey(),snaps);}catch(e){
    // Storage full — drop the oldest and retry once
    snaps.shift();try{sLS(snapKey(),snaps);}catch(_){}
  }
}
// Take a snapshot before anything that removes words, and note big drops.
function guardDeckSize(prevCount){
  if(!CU)return;
  const drop=prevCount-uw.length;
  if(drop>=Math.max(5,Math.ceil(prevCount*0.1))){
    console.warn(`[Deck] ${drop} words disappeared (${prevCount} → ${uw.length})`);
    toast(`⚠ ${drop} words removed — Settings ▸ Restore`,"#C04848");
  }
}
async function restoreSnapshot(idx){
  const snaps=getSnapshots();const s=snaps[idx];
  if(!s)return;
  const have=new Set(uw.map(w=>normArabic(w.arabic)));
  const missing=s.words.filter(w=>!have.has(normArabic(w.arabic)));
  if(!missing.length){toast("Nothing missing from that snapshot ✓");return;}
  if(!confirm(`Restore ${missing.length} word(s) that are in this backup but not in your deck now?\n\n`+
    missing.slice(0,15).map(w=>"  • "+w.arabic+" — "+w.english).join("\n")+
    (missing.length>15?`\n  …and ${missing.length-15} more`:"")))return;
  // Clear any pending deletes so we don't immediately re-delete what we restore
  setPendingDeletes([]);
  missing.forEach(w=>{
    uw.push({id:w.id,arabic:w.arabic,english:w.english,example:w.example,
      wordType:w.wordType,dialect:w.dialect,createdAt:w.createdAt||Date.now()});
    const lvl=mig(w.leitnerLevel);
    prog[w.id]={leitnerLevel:VI.has(lvl)?lvl:"L1",
      nextReview:nrf(lvl)||Date.now(),queuedAt:Date.now()};
  });
  saveUW();saveProgLocal();
  await saveProgressToDB();
  toast(`${missing.length} word${missing.length!==1?"s":""} restored ✓`);
  R();
}

// Import a backup file. Purely additive — only adds words whose Arabic text
// isn't already in the deck. Never overwrites or deletes anything.
async function importDeck(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  input.value="";
  let parsed;
  try{parsed=JSON.parse(await file.text());}
  catch(e){toast("That file isn't valid JSON","#C04848");return;}
  // Accept either {words:[...]} or a bare array
  const incoming=Array.isArray(parsed)?parsed:(parsed.words||[]);
  if(!incoming.length){toast("No words found in that file","#C04848");return;}
  const have=new Set(uw.map(w=>normArabic(w.arabic)));
  const missing=incoming.filter(w=>w&&w.arabic&&!have.has(normArabic(w.arabic)));
  if(!missing.length){toast(`All ${incoming.length} words are already in your deck ✓`);return;}
  if(!confirm(
    `This file holds ${incoming.length} word(s); ${missing.length} are missing from your deck.\n\n`+
    missing.slice(0,15).map(w=>"  • "+w.arabic+" — "+(w.english||"")).join("\n")+
    (missing.length>15?`\n  …and ${missing.length-15} more`:"")+
    `\n\nAdd them? Nothing already in your deck will change.`
  ))return;
  setPendingDeletes([]); // don't let a stale delete queue undo the restore
  missing.forEach(w=>{
    const id=w.id||uid();
    const lvl0=mig(w.leitnerLevel);
    const lvl=VI.has(lvl0)?lvl0:"L1";
    uw.push({id,arabic:w.arabic,english:w.english||"",example:w.example||"",
      wordType:w.wordType||"Noun",dialect:w.dialect||"MSA",
      createdAt:w.createdAt||Date.now()});
    prog[id]={leitnerLevel:lvl,nextReview:nrf(lvl)||Date.now(),queuedAt:Date.now()};
  });
  saveUW();saveProgLocal();
  await saveProgressToDB();
  toast(`${missing.length} word${missing.length!==1?"s":""} restored ✓`);
  R();
}

// Deduplication is MANUAL and CONFIRMED. It used to run automatically on every
// login and delete straight from Supabase — combined with an over-broad
// normalizer that cost real vocabulary. It will not run unattended again.
async function removeDuplicates(){
  const groups=findDuplicateGroups();
  if(!groups.length){toast("No duplicates found ✓");return;}
  const victims=groups.flatMap(g=>g.words.slice(1));
  const preview=groups.slice(0,12)
    .map(g=>"  • "+g.words.map(w=>w.arabic).join("   /   ")+"  → keeping “"+g.words[0].arabic+"”")
    .join("\n");
  const more=groups.length>12?`\n  …and ${groups.length-12} more group(s)`:"";
  if(!confirm(
    `Found ${groups.length} duplicate group(s). This will permanently delete ${victims.length} card(s), keeping the copy at the highest level in each group.\n\n${preview}${more}\n\nDelete them?`
  ))return;
  for(const w of victims){
    uw=uw.filter(x=>x.id!==w.id);
    delete prog[w.id];
    queuePendingDelete(w.id);
  }
  saveUW();saveProgLocal();
  await flushPendingDeletes();
  await saveProgressToDB();
  toast(`${victims.length} duplicate${victims.length!==1?"s":""} removed ✓`);
  R();
}

// Build a local-time YYYY-MM-DD key from a queued-at timestamp (ms or null)
function queueDateKey(ts){
  if(!ts)return "undated";
  const d=new Date(ts);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function queueDateLabel(key){
  if(key==="undated")return "Undated";
  const [y,m,d]=key.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((today.getTime()-dt.getTime())/86400000);
  const base=dt.toLocaleDateString("en",{weekday:"short",month:"short",day:"numeric"});
  if(diff===0)return base+" (today)";
  if(diff===1)return base+" (yesterday)";
  if(diff>1)return base+` (${diff} days ago)`;
  return base;
}

// Progress DB
// Fetch every row for a table, 1000 at a time. PostgREST caps a single response,
// so a large deck silently truncates without this.
async function sbGetAll(basePath){
  const PAGE=1000;let from=0;let all=[];
  try{
    for(let guard=0;guard<50;guard++){
      const rows=await sbFetch(basePath,{method:"GET",prefer:"",
        headers:{"Range-Unit":"items","Range":`${from}-${from+PAGE-1}`}});
      if(!rows||!rows.length)break;
      all=all.concat(rows);
      if(rows.length<PAGE)break;
      from+=PAGE;
    }
    return all;
  }catch(e){
    // Ranged paging unsupported or rejected — fall back to a single plain read
    console.warn("[Load] paged read failed, falling back to plain GET:",e.message||e);
    return await sbFetch(basePath,{method:"GET",prefer:""});
  }
}

async function saveProgressToDB(){
  if(!CU)return;
  saveProgLocal(); // local mirror first — never lose levels to a network failure
  if(syncing){pendingResync=true;return;}
  syncing=true;setSyncDot(true);
  let failed=false;
  try{
    // Save user-added words
    if(uw.length){
      const wordRows=uw.map(w=>({user_id:CU.id,word_id:w.id,arabic:w.arabic,english:w.english,example:w.example||"",word_type:w.wordType||"Noun",dialect:w.dialect||"MSA",created_at:w.createdAt?new Date(w.createdAt).toISOString():new Date().toISOString()}));
      for(let i=0;i<wordRows.length;i+=100)await sbUpsert("/user_words?on_conflict=user_id,word_id",wordRows.slice(i,i+100));
    }
    // Save progress
    const rows=Object.entries(prog).map(([word_id,v])=>({
      user_id:CU.id, word_id,
      leitner_level:v.leitnerLevel,
      // next_review is NOT NULL in the schema — guard against any code path that left it null
      next_review:(v.nextReview==null)?Date.now():v.nextReview,
      queued_at:v.queuedAt?new Date(v.queuedAt).toISOString():null,
      bonus_reviewed_at:v.bonusReviewedAt?new Date(v.bonusReviewedAt).toISOString():null,
      bonus_correct:v.bonusCorrect||0,
      bonus_wrong:v.bonusWrong||0,
      updated_at:new Date().toISOString()
    }));
    for(let i=0;i<rows.length;i+=100)await sbUpsert("/progress?on_conflict=user_id,word_id",rows.slice(i,i+100));
    // Success — clear any prior error
    if(lastSyncError){lastSyncError=null;}
  }catch(e){
    failed=true;
    lastSyncError=e.message||String(e);
    console.error("[Sync FAILED] Reviews/adds are NOT being saved to the server. Error:",lastSyncError,e);
    try{sLS("mufradat-last-sync-error",{msg:lastSyncError,at:Date.now()});}catch(_){}
    toast("⚠ Sync failed — tap sync dot for details","#C04848");
  }
  syncing=false;setSyncDot(failed);
  if(pendingResync){pendingResync=false;saveProgressToDB();}
}

// Arabic normalization for duplicate detection (strip tashkeel + take first part of "x · y")
// ── Two different duplicate tests, for two different jobs ────────────
//
// normArabic (above) governs DELETION and is deliberately strict — full entry,
// diacritics stripped. Being too loose there is what cost real vocabulary.
//
// The functions below govern ADD-TIME SKIPPING, and can afford to be looser:
// the worst case is a word you have to add by hand, and the UI always offers
// "add anyway". This is what catches the same word re-extracted with a plural
// attached, or with slightly different tashkeel.

// Headword: the part before the first "·" (singular, or a verb's past tense)
function normHead(s){return normArabic((s||"").split("·")[0]);}
function hasTashkeel(s){return /[\u064E\u064F\u0650\u0651]/.test(s||"");}

// Keep the LEXICAL diacritics (fatha/damma/kasra/shadda) and drop only the
// grammatical ones (tanwin = case endings, sukun = structural). This is the
// distinction that matters: عِلْم "science" and عَلَم "flag" differ *only* in
// their vowels, so stripping everything would merge two unrelated words —
// but كِتَاب and كِتَابٌ are the same word with a case ending.
function lexNorm(s){
  return (s||"")
    .replace(/[\u064B-\u064D\u0652\u0670]/g,"")
    .replace(/[\u0623\u0625\u0622\u0671]/g,"\u0627")
    .replace(/\s+/g," ").trim();
}
function headMatch(a,b){
  const ha=(a||"").split("·")[0], hb=(b||"").split("·")[0];
  if(!normArabic(ha)||!normArabic(hb))return false;
  // Both diacritized: the vowels carry meaning, so compare them.
  if(hasTashkeel(ha)&&hasTashkeel(hb))return lexNorm(ha)===lexNorm(hb);
  // One side undiacritized (hand-typed): fall back to consonants.
  return normArabic(ha)===normArabic(hb);
}

// Does this candidate already exist in the deck? Returns the existing card or null.
function findExistingWord(cand,pool){
  const words=pool||bw();
  const full=normArabic(cand.arabic);
  const type=(cand.wordType||"").toLowerCase();
  if(!full)return null;
  return words.find(w=>{
    // Same full entry, ignoring diacritics
    if(normArabic(w.arabic)===full)return true;
    // Same headword AND same part of speech. Requiring the wordType match is
    // what keeps root-siblings apart: كَتَبَ (Verb) vs كُتُب (Noun).
    if((w.wordType||"").toLowerCase()===type&&headMatch(w.arabic,cand.arabic))return true;
    return false;
  })||null;
}

// Split a freshly generated batch into what's new and what we already have,
// also catching repeats inside the batch itself.
function partitionNewCards(list){
  const pool=bw().slice();
  const fresh=[],skipped=[];
  list.forEach(c=>{
    if(!c||!c.arabic||!c.arabic.trim())return;
    const hit=findExistingWord(c,pool);
    if(hit)skipped.push({card:c,existing:hit});
    else{fresh.push(c);pool.push(c);} // add to pool so the batch self-dedupes
  });
  return{fresh,skipped};
}

// ── Darija → Latin script (Moroccan Arabizi) ──────────────────────
// Display-layer only. The Arabic stays exactly as stored; nothing is rewritten
// in the database, so this is fully reversible from the Settings toggle.
// Moroccan conventions: French-influenced ch/ou, numerals for the letters with
// no Latin equivalent (3=ع 7=ح 9=ق 2=hamza), kh/gh as digraphs.
const AR_FATHA='\u064E',AR_DAMMA='\u064F',AR_KASRA='\u0650',AR_SUKUN='\u0652',
      AR_SHADDA='\u0651',AR_FATHATAN='\u064B',AR_DAMMATAN='\u064C',
      AR_KASRATAN='\u064D',AR_DAGGER='\u0670';
const AR_CONS={
  'ب':'b','ت':'t','ث':'t','ج':'j','ح':'7','خ':'kh','د':'d','ذ':'d',
  'ر':'r','ز':'z','س':'s','ش':'ch','ص':'s','ض':'d','ط':'t','ظ':'d',
  'ع':'3','غ':'gh','ف':'f','ق':'9','ك':'k','ل':'l','م':'m','ن':'n',
  'ه':'h','ة':'a','و':'w','ي':'y','ى':'a',
  'ء':'2','أ':'2','إ':'2','ؤ':'2','ئ':'2','آ':'2a',
  'ݣ':'g','ڭ':'g','گ':'g','پ':'p','ڤ':'v','ﭪ':'v','چ':'ch','ا':'a'
};
const AR_SHORT={[AR_FATHA]:'a',[AR_DAMMA]:'ou',[AR_KASRA]:'i'};
const AR_TANWIN={[AR_FATHATAN]:'an',[AR_DAMMATAN]:'oun',[AR_KASRATAN]:'in'};
const AR_SUN='تثدذرزسشصضطظلن';
const arIsDia=c=>(c>='\u064B'&&c<='\u0652')||c===AR_DAGGER;

function translitWord(word){
  const ch=[...word];let out='',i=0;
  // Definite article: Moroccan drops the vowel; sun letters assimilate
  if(ch[0]==='ا'&&ch[1]==='ل'&&ch.length>2){
    const after=ch.slice(2).find(c=>!arIsDia(c));
    out+=AR_SUN.includes(after)?'':'l';i=2;
  }
  for(;i<ch.length;i++){
    const c=ch[i];
    if(arIsDia(c))continue;
    if(!(c in AR_CONS)){out+=c;continue;}
    // Shadda and the vowel mark can appear in either order — collect as a set
    const marks=new Set();let j=i+1;
    while(j<ch.length&&arIsDia(ch[j])){marks.add(ch[j]);j++;}
    const nextLetter=ch[j];
    // Carriers already voiced by the preceding vowel
    if(c==='ا'&&out.endsWith('a')){i=j-1;continue;}
    if(c==='و'&&out.endsWith('ou')){i=j-1;continue;}
    if(c==='ي'&&out.endsWith('i')){i=j-1;continue;}
    if(c==='ة'){if(!out.endsWith('a'))out+='a';i=j-1;continue;}
    let latin=AR_CONS[c];
    if(marks.has(AR_SHADDA))latin=latin+latin;
    out+=latin;
    let vowel='';
    for(const m of marks){
      if(m in AR_SHORT)vowel=AR_SHORT[m];
      if(m in AR_TANWIN)vowel=AR_TANWIN[m];
      if(m===AR_DAGGER)vowel='a';
    }
    if(vowel){
      if(vowel==='a'&&nextLetter==='ا'){i=j;out+='a';continue;}
      if(vowel==='ou'&&nextLetter==='و'){i=j;out+='ou';continue;}
      if(vowel==='i'&&nextLetter==='ي'){i=j;out+='i';continue;}
      if(vowel==='an'&&nextLetter==='ا'){i=j;out+='an';continue;}
      out+=vowel;
    }
    i=j-1;
  }
  return out.replace(/(.)\1{2,}/g,'$1$1'); // collapse triples (الله → llah)
}
function translit(text){
  if(!text)return text;
  return text.split(/(\s+|·|\(|\)|,|\.|\?|!|"|»|«|-|،|؟)/)
    .map(t=>/[\u0600-\u06FF]/.test(t)?translitWord(t):t)
    .join('').replace(/؟/g,'?').replace(/،/g,',');
}

// latinizeDarija is a user setting; when on, Darija cards render in Latin script.
function latinOn(){const v=gLS("mufradat-latin-darija");return v===null?true:!!v;}
function setLatin(on){sLS("mufradat-latin-darija",!!on);R();}

// Text of a card's Arabic (or example) field, transliterated when appropriate
function arT(w,field){

  return isLatin(w)?translit(raw||""):(raw||"");
}
// Matching typography: Latin renders LTR in the UI font, Arabic RTL in Naskh
function arS(w){

    : "direction:rtl;font-family:'Noto Naskh Arabic',serif;";

//
// DANGER ZONE — this function decides what counts as "the same word", and
// removeDuplicates() deletes based on it. It must NEVER reduce an entry to its
// bare consonantal skeleton: in Arabic that's a ROOT, not a word, and unrelated
// vocabulary sharing a root would look identical.
//   عَلِمَ (to know) / عِلْم (science) / عَلَم (flag) all share the root ع-ل-م
//   and must stay three separate cards.
// So: strip diacritics only, and always keep the FULL entry including every
// "singular · plural" or "past · present · masdar" segment.
function normArabic(s){
  return (s||"")
    .replace(/[\u064B-\u065F\u0670]/g,"")        // tashkeel only
    .replace(/[\u0623\u0625\u0622\u0671]/g,"\u0627") // أ إ آ ٱ → ا (orthographic variants)
    .replace(/\s+/g," ")
    .trim();
}

function queuePendingDelete(id){const cur=getPendingDeletes();if(!cur.includes(id)){cur.push(id);setPendingDeletes(cur);}}
async function flushPendingDeletes(){
  if(!CU)return;
  const ids=getPendingDeletes();
  if(!ids.length)return;

  for(const id of ids){

}

  return[...s,...u];

// Box order: a box is an ordered list, oldest entry first. A word's position
// is when it entered its current box (queuedAt); words from before that was
// tracked fall back to createdAt. Moving a word stamps a new queuedAt, which
// appends it to the end of the destination box.
function ordKey(w){return w.queuedAt||w.createdAt||0;}
function byOrder(a,b){return ordKey(a)-ordKey(b)||(a.createdAt||0)-(b.createdAt||0);}
// Midnight rule: once per calendar day, the first time the app opens that day,
// release ALL of L1Q into L1. This is the only box that moves on a timer —
// L2A/L3Q/L4Q/L5A only move when their destination box's step actually runs
// (handled inside the review engine below). Skipped while a session is live.
function cam(){
  if(!CU||sessionActive)return;
  const todayKey=new Date().toDateString();
  const lastKey=`mufradat-last-midnight-release-${CU.username}`;
  try{if(localStorage.getItem(lastKey)===todayKey)return;}catch(e){}
  const words=bw();
  let count=0;
  const stamp=Date.now();
  words.filter(w=>w.leitnerLevel==="L1Q").sort(byOrder).forEach((w,i)=>{
    prog[w.id]={...(prog[w.id]||{}),leitnerLevel:"L1",nextReview:stamp,queuedAt:stamp+i};
    count++;
  });
  try{localStorage.setItem(lastKey,todayKey);}catch(e){}
  if(count)saveProgressToDB();
}
// Which study boxes run today, per the fixed Daily Plan. Order is always
// high-to-low (RO); this only decides membership, not sequence.
function todaysPlan(){
  const day=new Date().getDay(); // Sunday=0 ... Saturday=6
  const s=new Set(["L1","L2B"]); // every day
  if(day===0||day===3)s.add("L3");     // Sun & Wed
  if(day===0){s.add("L4");s.add("L5B");} // Sun only
  return s;
}

function rL(){
  const words=bw(),lv=lvi(al),lw=words.filter(w=>w.leitnerLevel===al).sort(byOrder);

  if(al==="V")return rVault(tabs);
  const li=LV.findIndex(l=>l.id===al);
  const queueTargets={"L1Q":"L1","L2A":"L2B","L3Q":"L3","L4Q":"L4","L5A":"L5B"};
  const isQueue=queueTargets[al];
  const rows=lw.length===0?`<div style="text-align:center;color:#667788;padding:60px 0;font-size:14px">No words yet.</div>`:

      return`<div class="wr" style="border:1px solid rgba(${rgb(lv.c)},0.2)">

        ${li<LV.length-1?`<button onclick="MW('${w.id}',1)" style="background:none;border:none;cursor:pointer;color:#667788;font-size:14px;padding:3px 5px">↑</button>`:""}

      </div></div>`;

  return`<div class="ts">${tabs}</div>

function MW(id,d){const words=bw();const w=words.find(x=>x.id===id);if(!w)return;const ci=LV.findIndex(l=>l.id===w.leitnerLevel);const ni=Math.min(Math.max(ci+d,0),LV.length-1);const nl=LV[ni].id;prog[id]={leitnerLevel:nl,nextReview:nrf(nl)||Date.now(),queuedAt:Date.now()};scheduleSync();R();}

function toggleBulkExpand(i){
  if(bulkExpanded.has(i))bulkExpanded.delete(i);

function removeBulkCard(i){
  bulkCards.splice(i,1);
  // Reindex expanded set: anything > i shifts down by 1, i itself is dropped
  const next=new Set();
  bulkExpanded.forEach(idx=>{
    if(idx<i)next.add(idx);
    else if(idx>i)next.add(idx-1);
  });
  bulkExpanded=next;
  R();
}

async function generateBulkCards(){
  if(!navigator.onLine){toast("AI features need a connection","#C49E3C");return;}

  if(!text){toast("Please enter some words first","#C04848");return;}
  const apiKey=(gLS(`mufradat-apikey-${CU.username}`)||'').replace(/^["']|["']$/g,'');
  if(!apiKey){toast("No API key. Add it in Settings.","#C04848");return;}
  const btn=document.getElementById("bulk-btn");
  if(btn){btn.innerHTML=`<span class="spinner"></span>Generating cards…`;btn.disabled=true;}

  const prompt=`You are an expert Arabic linguist. Generate flashcard data for the following word list.

Default dialect: ${dialect}
The user may prefix lines with a dialect override like "these are Darija:" — respect that for all following words until another override.

Rules:
- For NOUNS: include the singular with full diacritics, then " · " then the plural with full diacritics in the arabic field. English should be "singular meaning, plural meaning" if they differ, otherwise just the meaning.
- For VERBS: include past tense (ماضي) · present tense (مضارع) · masdar (مصدر) all with full diacritics separated by " · " in the arabic field. English should be "to [verb]".
- For all other word types: just the word with full diacritics.
- Always include full tashkeel (diacritics) on ALL Arabic text.
- Do NOT write example sentences. Leave "example" as an empty string. Example
  sentences are generated later, only for words that enter active review.
- Detect whether the input word is Arabic or English and generate the other side accordingly.
- wordType must be one of: Noun, Verb, Adjective, Adverb, Phrase, Preposition, Conjunction, Other
- dialect must be one of: MSA, Darija, Shaami, Egyptian, Gulf, Other

Word list:
${text}

Return ONLY a valid JSON array, no markdown, no explanation. Each object:
{
  "arabic": "...",
  "english": "...",
  "example": "",
  "wordType": "...",
  "dialect": "..."
}`;

  try{
    const res=await fetch("https://tiny-sound-c8ff.jmorgansmith03.workers.dev",{method:"POST",

async function confirmBulkCards(){
  if(!bulkCards.length){toast("No cards to add — generate some first","#C49E3C");return;}
  const tl=document.getElementById("bulk-target-level")?.value||"V";
  // Re-check at save time — the deck may have changed since generation, and
  // this also catches repeats within the pending list itself.
  const pool=bw().slice();
  const toAdd=[];
  const skipped=[];
  bulkCards.forEach(c=>{
    if(!c.arabic||!c.arabic.trim()){skipped.push({arabic:c.arabic||"(empty)",reason:"empty"});return;}
    const hit=c._forced?null:findExistingWord(c,pool);
    if(hit){skipped.push({arabic:c.arabic,reason:"duplicate",of:hit.arabic});return;}
    toAdd.push(c);pool.push(c);
  });
  console.log(`[bulk add] generated ${bulkCards.length}, adding ${toAdd.length}, skipping ${skipped.length}`);
  if(skipped.length)console.log("[bulk add] skipped:",skipped);
  if(toAdd.length)console.log("[bulk add] adding:",toAdd.map(c=>c.arabic));
  toAdd.forEach(w=>{w.leitnerLevel=tl;w.nextReview=nrf(tl)||Date.now();});
  toAdd.forEach(w=>{delete w._forced;});
  uw.push(...toAdd);saveUW();
  toAdd.forEach(w=>{prog[w.id]={leitnerLevel:tl,nextReview:nrf(tl)||Date.now(),queuedAt:Date.now()};});
  saveProgressToDB();
  const lv=LV.find(l=>l.id===tl);
  const tlName=lv?lv.l:tl;
  let msg,color;
  if(toAdd.length===0&&skipped.length>0){
    msg=`0 added — all ${skipped.length} already in your deck`;color="#C49E3C";
  }else if(skipped.length>0){
    msg=`${toAdd.length} added to ${tlName} · ${skipped.length} skipped (duplicates)`;
  }else{
    msg=`${toAdd.length} card${toAdd.length!==1?"s":""} added to ${tlName} ✓`;
  }
  // Adding straight into a review level skips the Vault, so fill examples now
  if(tl!=="V"&&toAdd.length){
    const needing=toAdd.filter(w=>!(w.example||"").trim()).length;
    if(needing){
      toast(`Writing ${needing} example sentence${needing!==1?"s":""}…`);
      await fillExamples(toAdd);
      await saveProgressToDB();
    }
  }
  toast(msg,color);
  const from=bulkSource;
  bulkCards=[];
  bulkExpanded.clear();
  bulkSkipped=[];
  if(from==="import")importImages=[]; // screenshots have served their purpose
  V("home");
}

// ── REVIEW ENGINE ──────────────────────────────────────────────────
// Each selected box runs as its own discrete step, high level to low
// (sessionSteps, in RO order). A step's snapshot is taken once, up front;
// nothing is added to it mid-step, and every card in it is shown exactly
// once. When a step's snapshot is exhausted, the box's own release rule
// fires (see finishStep) before the next step begins.
function startSession(d){
  const enabled=new Set(RO.filter(id=>el.has(id)));
  enabled.add("L1"); // always runs, always last
  sessionSteps=RO.filter(id=>enabled.has(id));
  const total=sessionSteps.reduce((n,id)=>n+bw().filter(w=>w.leitnerLevel===id&&(df==="All"||w.dialect===df)).length,0);
  if(!total){toast("Nothing to review in the selected levels","#C49E3C");return;}
  rd=d;stepIdx=0;rr=[];fl=false;pendingRelease=null;sessionActive=true;
  setupStep();
}
function setupStep(){
  if(stepIdx>=sessionSteps.length)return endSession();
  const level=sessionSteps[stepIdx];
  let pool=bw().filter(w=>w.leitnerLevel===level&&(df==="All"||w.dialect===df));
  const budget=sessionBudget();
  if(budget&&pool.length>budget){
    const{picked}=buildSession(pool,budget,prioritizeTypes());
    pool=picked;
  }
  rq=pool.slice().sort(byOrder); // oldest-waiting first
  ri=0;fl=false;
  if(!rq.length)return finishStep(); // nothing at this level — step trivially done
  V("review");
}
function releaseAll(from,to){
  const now=Date.now();
  bw().filter(w=>w.leitnerLevel===from).sort(byOrder).forEach((w,i)=>{
    prog[w.id]={...(prog[w.id]||{}),leitnerLevel:to,nextReview:now,queuedAt:now+i};
  });
}
async function finishStep(){
  const level=sessionSteps[stepIdx];
  if(level==="L1"){
    // Always last: L1Q clears automatically, then the session ends.
    releaseAll("L1Q","L1");
    await saveProgressToDB();
    return endSession();
  }
  if(level==="L3")releaseAll("L3Q","L3");
  if(level==="L4")releaseAll("L4Q","L4");
  if(level==="L2B"){
    const waiting=bw().filter(w=>w.leitnerLevel==="L2A");
    if(waiting.length){
      pendingRelease={from:"L2A",to:"L2B"};
      await saveProgressToDB();
      V("release-prompt");
      return;
    }
  }
  if(level==="L5B"){
    const waiting=bw().filter(w=>w.leitnerLevel==="L5A");
    if(waiting.length){
      pendingRelease={from:"L5A",to:"L5B"};
      await saveProgressToDB();
      V("release-prompt");
      return;
    }
  }
  await saveProgressToDB();
  stepIdx++;
  setupStep();
}
async function answerRelease(yes){
  if(!pendingRelease)return;
  const{from,to}=pendingRelease;
  if(yes)releaseAll(from,to);
  pendingRelease=null;
  await saveProgressToDB();
  stepIdx++;
  setupStep();
}
function endSession(){
  sessionActive=false;
  V("done");
}
function rReleasePrompt(){
  if(!pendingRelease)return"";
  const{from,to}=pendingRelease;

    </div>
  </div>`;
}

// ── BONUS SESSION (drilling mastered words, no level changes) ──
// Mastered words carry a real 1-5 star rating plus a strike counter. Stars go
// up/down with each answer; two consecutive wrong answers at 0 stars demotes
// the word out of Mastered back to L5B and wipes its star record. This is the
// ONLY way a Mastered word ever moves.
function bonusStars(p){return Math.max(0,Math.min(5,p?.stars||0));}
function shuffleInPlace(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function pickBonusWords(count){
  const mastered=bw().filter(w=>w.leitnerLevel==="M");
  if(!mastered.length)return [];
  // Never-quizzed first (shuffled), then fewest stars, then least-recently-quizzed
  const never=shuffleInPlace(mastered.filter(w=>!prog[w.id]?.bonusReviewedAt));
  const been=shuffleInPlace(mastered.filter(w=>prog[w.id]?.bonusReviewedAt)).sort((a,b)=>{
    const sa=bonusStars(prog[a.id]),sb=bonusStars(prog[b.id]);
    if(sa!==sb)return sa-sb;
    return (prog[a.id]?.bonusReviewedAt||0)-(prog[b.id]?.bonusReviewedAt||0);
  });
  return [...never,...been].slice(0,count);
}
function startBonusSession(){
  const countSel=document.getElementById("bonus-count");

  const requested=countSel?countSel.value:"50";
  bRd=dirSel?dirSel.value:"ar-en";
  const masteredTotal=bw().filter(w=>w.leitnerLevel==="M").length;
  const count=requested==="all"?masteredTotal:Math.min(parseInt(requested,10),masteredTotal);
  const picked=pickBonusWords(count);
  if(!picked.length){toast("No mastered words yet — keep reviewing!","#C49E3C");return;}
  bRq=picked;bRi=0;bFl=false;bRr=[];
  V("bonus");
}
function gradeBonusCard(correct){
  const card=bRq[bRi];if(!card)return;
  const cur=prog[card.id]||{leitnerLevel:"M"};
  const stars=bonusStars(cur),strikes=cur.strikes||0;
  if(correct){
    prog[card.id]={...cur,leitnerLevel:"M",bonusReviewedAt:Date.now(),stars:Math.min(5,stars+1),strikes:0};
  }else if(stars>0){
    prog[card.id]={...cur,leitnerLevel:"M",bonusReviewedAt:Date.now(),stars:stars-1,strikes:0};
  }else if(strikes+1>=2){
    // Two strikes at 0 stars — out of Mastered, star record wiped.
    prog[card.id]={leitnerLevel:"L5B",nextReview:Date.now(),queuedAt:Date.now()};
  }else{
    prog[card.id]={...cur,leitnerLevel:"M",bonusReviewedAt:Date.now(),stars:0,strikes:strikes+1};
  }
  bRr.push(correct?"right":"wrong");
  bFl=false;
  if(bRi+1>=bRq.length){
    saveProgressToDB();
    V("bonus-done");
  }else{
    bRi++;
    saveProgressToDB(); // mid-session save (matches existing review behavior)
    R();
  }
}

// Downscale + re-encode so large screenshots don't blow past API limits or cost a fortune.
// 1568px on the long edge is Anthropic's recommended max before they downscale anyway.
function prepareImage(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith("image/")){reject(new Error("Not an image"));return;}
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth,h=img.naturalHeight;
      const MAX=1568;
      if(w>MAX||h>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,w,h); // flatten transparency (JPEG has none)
      ctx.drawImage(img,0,0,w,h);
      const dataUrl=cv.toDataURL("image/jpeg",0.92);
      resolve({dataUrl,base64:dataUrl.split(",")[1],mediaType:"image/jpeg",name:file.name||"screenshot"});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Could not read image"));};
    img.src=url;
  });
}
async function addImportImages(fileList){

}

// Transliteration map for English -> Arabic root conversion
const TRANSLIT = {
  'a':'ا','b':'ب','t':'ت','th':'ث','j':'ج','h':'ح','kh':'خ','d':'د',
  'dh':'ذ','r':'ر','z':'ز','s':'س','sh':'ش','S':'ص','D':'ض','T':'ط',
  'Z':'ظ','3':'ع','gh':'غ','f':'ف','q':'ق','k':'ك','l':'ل','m':'م',
  'n':'ن','w':'و','y':'ي','H':'ه','e':'ع','g':'غ','p':'ف','c':'ك',
  'x':'خ','i':'ي','u':'و','aa':'ا','ee':'ي','oo':'و'
};

function translitToArabic(input){
  let result='';
  let i=0;
  const s=input.toLowerCase().replace(/[-\s]/g,'');
  while(i<s.length){
    if(i+1<s.length&&TRANSLIT[s[i]+s[i+1]]){
      result+=TRANSLIT[s[i]+s[i+1]];i+=2;
    } else if(TRANSLIT[s[i]]){
      result+=TRANSLIT[s[i]];i++;
    } else {
      result+=s[i];i++;
    }
  }
  return result;
}

// ── ARABIC ROOT MATCHING ──
// Strip common attached pronouns/prepositions to find base word
function arabicRootMatch(token, wordList){
  const clean = token.replace(/[،؟!.,ً-ٟ]/g,""); // strip punctuation and tashkeel
  if(!clean) return null;
  
  // Check exact match first (ignoring tashkeel)
  const stripTashkeel = s => s.replace(/[ً-ٟ]/g,"");
  const cleanStripped = stripTashkeel(clean);
  
  const exact = wordList.find(w => stripTashkeel(w.arabic.split(" · ")[0]) === cleanStripped);
  if(exact) return exact;
  
  // Common suffixes to strip (possessive pronouns, object pronouns, etc.)
  const suffixes = [
    "هُمْ","هُنَّ","كُمْ","كُنَّ","هَا","هُ","هِ","كَ","كِ","نَا","نِي","يَ","ي",
    "هم","هن","كم","كن","ها","هو","ك","نا","ني","ي",
    "تَانِ","تَيْنِ","انِ","يْنِ","ونَ","ينَ","اتٌ","اتٍ","اتِ",
  ];
  
  // Common prefixes to strip
  const prefixes = ["وَ","فَ","بِ","لِ","كَ","وَال","فَال","بِال","لِل","ال","وَ","فَ"];
  
  let base = cleanStripped;
  
  // Try stripping prefixes
  for(const pre of prefixes){
    const preStripped = stripTashkeel(pre);
    if(base.startsWith(preStripped) && base.length > preStripped.length + 1){
      const candidate = base.slice(preStripped.length);
      const found = wordList.find(w => stripTashkeel(w.arabic.split(" · ")[0]) === candidate);
      if(found) return found;
    }
  }
  
  // Try stripping suffixes
  for(const suf of suffixes){
    const sufStripped = stripTashkeel(suf);
    if(base.endsWith(sufStripped) && base.length > sufStripped.length + 1){
      const candidate = base.slice(0, base.length - sufStripped.length);
      const found = wordList.find(w => stripTashkeel(w.arabic.split(" · ")[0]) === candidate);
      if(found) return found;
      // Also try with ٌ ٍ ً endings on the candidate
      const foundTan = wordList.find(w => {
        const ws = stripTashkeel(w.arabic.split(" · ")[0]);
        return ws === candidate+"ن" || ws.slice(0,-1) === candidate;
      });
      if(foundTan) return foundTan;
    }
  }
  
  return null;
}

let applyPopup=null;

function renderApplyText(text){
  const words=bw();
  return text.split(/\s+/).map(token=>{
    if(!token.trim())return " ";
    const clean=token.replace(/[،؟!.,]/g,"");
    if(!clean)return token;
    const matched=arabicRootMatch(clean, words);
    const isMastered=matched&&matched.leitnerLevel==="M";
    const isKnown=!!matched;
    const color=isMastered?"#EDE0C6":isKnown?"#7BC8E8":"#5AABDE";
    const underline=isMastered?"none":"1px dashed rgba(90,171,222,0.5)";
    return `<span onclick="showWordPopup('${clean.replace(/'/g,"\'")}',event)" style="cursor:pointer;color:${color};border-bottom:${underline};padding:0 2px;margin:0 1px;display:inline-block">${token}</span>`;
  }).join(" ");
}

function showWordPopup(word, e){
  if(!word||!word.trim())return;
  // Remove existing popup
  const old=document.getElementById("word-popup");
  if(old){old.remove();if(applyPopup===word){applyPopup=null;return;}}
  applyPopup=word;
  const words=bw();
  const existing=arabicRootMatch(word, words);
  // Create popup
  const popup=document.createElement("div");
  popup.id="word-popup";
  popup.style.cssText="position:fixed;z-index:300;background:#0C1B30;border:1px solid rgba(196,158,60,0.4);border-radius:12px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.7);min-width:200px;max-width:280px";
  // Position near tap
  const x=Math.min(e.clientX, window.innerWidth-290);
  const y=e.clientY+20;
  popup.style.left=Math.max(10,x)+"px";
  popup.style.top=Math.min(y, window.innerHeight-140)+"px";
  if(existing){
    popup.innerHTML=`<div style="font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:20px;color:#EDD98A;margin-bottom:6px">${word}</div>
      <div style="font-size:12px;color:#3A9864;margin-bottom:10px">Already in ${lvi(existing.leitnerLevel).l}</div>
      <button onclick="document.getElementById('word-popup').remove();applyPopup=null" style="background:none;border:1px solid rgba(196,158,60,0.3);border-radius:8px;padding:6px 14px;color:#667788;cursor:pointer;font-family:inherit;font-size:12px">Close</button>`;
  } else {
    popup.innerHTML=`<div style="font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:20px;color:#EDD98A;margin-bottom:10px">${word}</div>
      <div style="display:flex;gap:8px">
        <button onclick="addWordFromApply('${word.replace(/'/g,"\'")}','V');document.getElementById('word-popup').remove();applyPopup=null" style="flex:1;background:rgba(102,119,136,0.18);border:1px solid rgba(102,119,136,0.45);border-radius:8px;padding:8px 6px;color:#8D9AA8;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600">+ Vault</button>
        <button onclick="addWordFromApply('${word.replace(/'/g,"\'")}','L1Q');document.getElementById('word-popup').remove();applyPopup=null" style="flex:1;background:rgba(192,72,72,0.15);border:1px solid rgba(192,72,72,0.4);border-radius:8px;padding:8px 6px;color:#C04848;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600">+ L1 Queue</button>
        <button onclick="addWordFromApply('${word.replace(/'/g,"\'")}','M');document.getElementById('word-popup').remove();applyPopup=null" style="flex:1;background:rgba(58,152,100,0.15);border:1px solid rgba(58,152,100,0.4);border-radius:8px;padding:8px 6px;color:#3A9864;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600">+ Mastered</button>
      </div>`;
  }
  document.body.appendChild(popup);
  // Close on outside tap
  setTimeout(()=>{
    document.addEventListener("click",function handler(ev){
      if(!popup.contains(ev.target)){popup.remove();applyPopup=null;document.removeEventListener("click",handler);}
    });
  },100);
}

async function addWordFromApply(word, level){
  if(level==="L1Q"&&sessionWaitingBox())level=sessionWaitingBox(); // live session: waiting box for the current step
  const apiKey=(gLS(`mufradat-apikey-${CU.username}`)||'').replace(/^["']|["']$/g,'');
  const lv=LV.find(l=>l.id===level);
  toast('Generating card for "'+word+'"…','#C49E3C');

  let arabic=word, english="", example="", wordType="Noun";

  if(apiKey){
    try{
      const prompt=`You are an Arabic linguist. Generate a flashcard for this Arabic word: ${word}
Return ONLY valid JSON (no markdown, no newlines inside strings):
{"arabic":"${word} with full tashkeel","english":"English meaning","example":"Example sentence in Arabic with full tashkeel (English translation in parentheses)","wordType":"Noun or Verb or Adjective or Adverb or Phrase or Conjunction or Preposition or Other","dialect":"${applyDialect}"}`;
      const res=await fetch("https://tiny-sound-c8ff.jmorgansmith03.workers.dev",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(!data.error){
        const raw=data.content?.map(c=>c.text||"").join("")||"";
        let jsonStr=raw.replace(/```json|```/g,"").trim();
        const fb=jsonStr.indexOf("{"),lb=jsonStr.lastIndexOf("}");
        if(fb!==-1&&lb!==-1)jsonStr=jsonStr.slice(fb,lb+1);
        jsonStr=jsonStr.split("\n").join(" ").split("\r").join(" ");
        const parsed=JSON.parse(jsonStr);
        arabic=parsed.arabic||word;
        english=parsed.english||"";
        example=parsed.example||"";
        wordType=parsed.wordType||"Noun";
      }
    }catch(e){console.warn("Card gen failed:",e);}
  }

  const w={id:uid(),arabic,english,example,wordType,dialect:applyDialect,leitnerLevel:level,nextReview:nrf(level)||Date.now(),createdAt:Date.now()};
  uw.push(w);saveUW();prog[w.id]={leitnerLevel:level,nextReview:nrf(level)||Date.now(),queuedAt:Date.now()};saveProgressToDB();
  toast('"'+word+'" added to '+(lv?lv.l:level)+' ✓');
  R();
}

Return ONLY valid JSON: {"text":"...paragraph..."}`;
  }
  try{
    const res=await fetch("https://tiny-sound-c8ff.jmorgansmith03.workers.dev",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    if(data.error){toast(data.error.message||"API error","#C04848");}
    else{
      const raw=data.content?.map(c=>c.text||"").join("")||"";
      let jsonStr=raw.replace(/```json|```/g,"").trim();
      const fb=jsonStr.indexOf("{"),lb=jsonStr.lastIndexOf("}");
      if(fb!==-1&&lb!==-1)jsonStr=jsonStr.slice(fb,lb+1);
      jsonStr=jsonStr.split("\n").join(" ").split("\r").join(" ");

  if(btn){btn.disabled=false;btn.innerHTML=applyMode==="reading"?"📖 Generate Paragraph":"⚙️ Generate Sentences";}

}

    await sbFetch(`/users?id=eq.${CU.id}`,{method:"PATCH",body:JSON.stringify({api_key:v}),prefer:"return=minimal"});
    toast(v?"API key saved & synced ✓":"API key cleared");
  }catch(e){
    toast(v?"API key saved locally ✓":"API key cleared");
  }
}
function saveTarget(){const v=parseInt(document.getElementById("wt-input")?.value)||60;wt=v;sLS("mufradat-target",wt);toast("Target saved ✓");}
function SD(d){df=d;R();}
function ET(){const n=prompt("Set Level 1 word target:",wt);if(n&&parseInt(n)>0){wt=parseInt(n);sLS("mufradat-target",wt);R();}}

// ── BOOT ──
(async function(){
  const t=gLS("mufradat-target");if(t)wt=parseInt(t)||60;
  const session=gLS("mufradat-session");
  if(session&&session.id&&session.username){
    CU=session;loadUW();
    const cached=loadProgLocal();
    if(cached)console.log(`[Boot] ${cached} levels restored from local cache`);
    SU.forEach(w=>{const id=sid(w.arabic);if(!prog[id])prog[id]={leitnerLevel:"L1",nextReview:Date.now()};});
    await flushPendingDeletes();
    const loaded=await loadProgressFromDB();
    cam();
    // Only push to the server if we actually got a clean read — otherwise we'd risk
    // writing a stale local picture over good cloud data.
    if(loaded)await saveProgressToDB();
    el=todaysPlan();view="home";
  }
  R();
  // Safety net: best-effort sync on tab close. Uses fetch+keepalive so we can
  // send the auth headers Supabase requires (sendBeacon can't set them).
  function flushOnExit(){
    if(!CU)return;
    const headers={"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"};
    if(uw.length){
      const wordRows=uw.map(w=>({user_id:CU.id,word_id:w.id,arabic:w.arabic,english:w.english,example:w.example||"",word_type:w.wordType||"Noun",dialect:w.dialect||"MSA",created_at:w.createdAt?new Date(w.createdAt).toISOString():new Date().toISOString()}));
      try{fetch(`${SB_URL}/rest/v1/user_words?on_conflict=user_id,word_id`,{method:"POST",headers,body:JSON.stringify(wordRows),keepalive:true}).catch(()=>{});}catch(e){}
    }
    if(Object.keys(prog).length){
      const rows=Object.entries(prog).map(([word_id,v])=>({user_id:CU.id,word_id,leitner_level:v.leitnerLevel,next_review:v.nextReview,queued_at:v.queuedAt?new Date(v.queuedAt).toISOString():null,bonus_reviewed_at:v.bonusReviewedAt?new Date(v.bonusReviewedAt).toISOString():null,bonus_correct:v.bonusCorrect||0,bonus_wrong:v.bonusWrong||0,updated_at:new Date().toISOString()}));
      try{fetch(`${SB_URL}/rest/v1/progress?on_conflict=user_id,word_id`,{method:"POST",headers,body:JSON.stringify(rows),keepalive:true}).catch(()=>{});}catch(e){}
    }
  }
  window.addEventListener("beforeunload",flushOnExit);
  // Mobile browsers often skip beforeunload — visibilitychange is more reliable
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushOnExit();});
  window.addEventListener("pagehide",flushOnExit);

  // Online/offline: re-sync when we come back online, re-render so the offline indicator updates
  window.addEventListener("online",async()=>{
    setSyncDot(false);
    if(CU){
      try{await flushPendingDeletes();}catch(e){}
      saveProgressToDB();
    }
    R();
  });
  window.addEventListener("offline",()=>{setSyncDot(false);R();});

  // Paste a screenshot straight into the AI Import tab (Ctrl/Cmd+V)
  document.addEventListener("paste",e=>{
    if(view!=="import")return;
    const items=e.clipboardData?.items;if(!items)return;
    const files=[];
    for(const it of items){
      if(it.kind==="file"&&it.type.startsWith("image/")){
        const f=it.getAsFile();if(f)files.push(f);
      }
    }
    if(files.length){
      e.preventDefault(); // don't also dump binary junk into the textarea
      addImportImages(files);
      toast(`${files.length} image${files.length!==1?"s":""} pasted ✓`);
    }
  });

  // Service worker registration — caches assets for offline boot
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("SW registration failed",e));
    });
  }
})();
</script>
